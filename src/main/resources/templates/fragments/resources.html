<head th:fragment="common-resources">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title}"></title>
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
		rel="stylesheet">
	<link rel="icon" type="image/png" href="/assets/images/logo/LOGO_V3-BLACK_(NO_TEXT).png">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
	
	
	<link rel="stylesheet" href="/assets/css/nav.css" />
	<link rel="stylesheet" href="/assets/css/footer.css" />
	<link rel="stylesheet" th:if="${styles0 != null}" th:href="@{${styles0}}" />
	<link rel="stylesheet" th:if="${styles != null}" th:href="@{${styles}}" />

	<th:block th:replace="~{fragments/resources :: cloudflare-web-analytics}"></th:block>
</head>

<head th:fragment="auth-resources">
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title th:text="${title}"></title>

	<link rel="icon" type="image/png" href="/assets/images/logo/LOGO_V3-BLACK_(NO_TEXT).png">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/assets/css/auth.css?v=auth-pages-2">

	<th:block th:replace="~{fragments/resources :: cloudflare-web-analytics}"></th:block>
</head>

<th:block th:fragment="cloudflare-web-analytics">
	<script th:if="${cloudflareWebAnalytics != null and cloudflareWebAnalytics.enabled}" defer
		src="https://static.cloudflareinsights.com/beacon.min.js"
		th:attr="data-cf-beacon=${cloudflareWebAnalytics.beaconConfigJson}"></script>
</th:block>

<th:block th:fragment="common-scripts">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="/assets/js/global.js?v=shared-layout-1"></script>
	<script src="/assets/js/server.js"></script>
	<script th:if="${scripts != null}" th:src="@{${scripts}}"></script>
</th:block>
