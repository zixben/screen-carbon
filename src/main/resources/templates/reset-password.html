<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/resources :: auth-resources}">
</head>

<body>
	<section class="p-0 bg-color">
		<div class="full-page__wrapper">
			<div class="full-page__image">
				<img src="/assets/images/comming-soon.jpg" alt="comming-soon" />
				<div class="contact__overlay">
					<div class="contact__info">
						<h2 class="section__title">Reset your screen carbon ratings password</h2>
					</div>
				</div>
			</div>
			<div class="full-page__inner">
				<div class="full-page__content">
					<div class="full-page__logo auth-logo-wrap">
						<a th:href="@{/}">
							<img class="auth-logo" src="/assets/images/logo/LOGO_V3-BLACK_(NO_TEXT).png" alt="logo" />
						</a>
					</div>
					<div class="form__inner">
						<div th:if="${message != null}" class="form__wrapper p-0">
							<h2 class="popup__title">Reset Password</h2>
							<div class="alert alert-danger auth-alert" th:text="${message}"></div>
							<div class="account__desc justify-content-center">
								<div class="account__meta">
									<a th:href="@{/login}">Back to login</a>
								</div>
							</div>
						</div>
						<form th:if="${token != null}" id="resetPasswordForm" class="form__wrapper p-0">
							<h2 class="popup__title">Reset Password</h2>
							<input type="hidden" id="token" th:value="${token}">
							<div class="form-group">
								<label for="newPassword">New Password</label>
								<input type="password" class="form-control" id="newPassword" name="newPassword"
									placeholder="Enter new password" required>
							</div>
							<div class="form-group">
								<label for="confirmPassword">Confirm Password</label>
								<input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
									placeholder="Confirm new password" required>
							</div>
							<input type="hidden" th:name="_csrf" th:value="${csrfToken.token}" />
							<div class="submit__btn">
								<button type="submit" class="btn btn-primary mt-0 w-100">Update Password</button>
							</div>
							<div id="responseMessage" class="auth-response" aria-live="polite"></div>
							<div class="account__desc justify-content-center">
								<div class="account__meta">
									<a th:href="@{/login}">Back to login</a>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<button class="scroll-top scroll-to-target" data-target="html">scroll</button>

	<th:block th:replace="~{fragments/resources :: common-scripts}"></th:block>
</body>

</html>
