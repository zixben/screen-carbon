<!DOCTYPE html>
<html layout:decorate="~{layouts/default}">

<head>
	<title th:text="${title}"></title>
</head>

<body>
	<div layout:fragment="content">
		<div class="pageBody search-page">
			<header class="search-page__header">
				<div>
					<p class="search-page__eyebrow">Search results</p>
					<h2 class="search-page__title">"<span class="searchValue"></span>"</h2>
				</div>
				<p class="search-page__summary" id="searchResultsSummary" aria-live="polite"></p>
			</header>

			<div class="search-tabs" role="tablist" aria-label="Search result type">
				<button type="button" class="search-tabs__button active" data-search-type="movie" role="tab"
					aria-selected="true">
					<i class="bi bi-film" aria-hidden="true"></i>
					<span>Films</span>
				</button>
				<button type="button" class="search-tabs__button" data-search-type="tv" role="tab"
					aria-selected="false">
					<i class="bi bi-tv" aria-hidden="true"></i>
					<span>TV shows</span>
				</button>
				<button type="button" class="search-tabs__button" data-search-type="person" role="tab"
					aria-selected="false">
					<i class="bi bi-people" aria-hidden="true"></i>
					<span>Cast & crew</span>
				</button>
			</div>

			<div class="media-pagination media-pagination--top search-pagination">
				<nav class="media-pagination__nav" aria-label="Search results pagination">
					<button type="button" class="media-pagination__button page-item" data-action="prev"
						aria-label="Previous page">
						<i class="bi bi-chevron-left" aria-hidden="true"></i>
						<span>Previous</span>
					</button>
					<div class="media-pagination__current" aria-live="polite">
						<span class="media-pagination__label">Page</span>
						<span class="media-pagination__number" data-pagination-current>1</span>
						<span class="media-pagination__total" data-pagination-total></span>
					</div>
					<button type="button" class="media-pagination__button page-item" data-action="next"
						aria-label="Next page">
						<span>Next</span>
						<i class="bi bi-chevron-right" aria-hidden="true"></i>
					</button>
				</nav>
			</div>

			<div class="search-results">
				<div class="items" aria-live="polite"></div>
			</div>

			<div class="media-pagination search-pagination">
				<nav class="media-pagination__nav" aria-label="Search results pagination">
					<button type="button" class="media-pagination__button page-item" data-action="prev"
						aria-label="Previous page">
						<i class="bi bi-chevron-left" aria-hidden="true"></i>
						<span>Previous</span>
					</button>
					<div class="media-pagination__current" aria-live="polite">
						<span class="media-pagination__label">Page</span>
						<span class="media-pagination__number" data-pagination-current>1</span>
						<span class="media-pagination__total" data-pagination-total></span>
					</div>
					<button type="button" class="media-pagination__button page-item" data-action="next"
						aria-label="Next page">
						<span>Next</span>
						<i class="bi bi-chevron-right" aria-hidden="true"></i>
					</button>
				</nav>
			</div>
		</div>
	</div>
</body>

</html>
